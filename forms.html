<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <link rel="stylesheet" href="static/css/forms.css">
</head>
<body>
    <h2 id="hello">Contact us</h2>
    <form id="myform">
        <label for="name">Fullname:</label>
        <input type="text" id="name" name="fullname" placeholder="Enter your fullname" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <label for="phone">Phone number:</label>
        <input type="tel" id="phone"  name="phone"  placeholder="Enter phone number" required><br><br>
        <label for="message">Message:</label><br>
        <textarea name="message" id="message" rows="5" cols="30" required></textarea><br>
        <input type="submit" value="Send Message">
    </form>
    
</body>
</html>
